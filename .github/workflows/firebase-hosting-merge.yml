# This file was auto-generated by the Firebase CLI and updated for Mobilis CI/CD
name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: mobilis-frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: mobilis-frontend
      - name: Build frontend
        run: npm run build
        working-directory: mobilis-frontend
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MOBILIS_10F9A }}
          channelId: live
          projectId: mobilis-10f9a
          entryPoint: ./mobilis-frontend
